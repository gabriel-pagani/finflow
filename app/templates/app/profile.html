{% extends 'app/app.html' %}
{% load static %}

{% block title %}Meu perfil - FinFlow{% endblock %}

{% block styles %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'app/css/profile.css' %}">
{% endblock %}

{% block content %}
    <section class="card profile-card">
        <h1>Meu perfil</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Salvar</button>
        </form>
    </section>
{% endblock %}
