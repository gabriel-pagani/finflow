upstream django {
    server django:8000;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $request_uri $is_login {
    default            0;
    ~*/login/?(\?|$)   1;
}

map $http_cf_connecting_ip $real_client_ip {
    default  $http_cf_connecting_ip;
    ''       $remote_addr;
}

map "$is_login:$request_method" $login_limit_key {
    default       "";
    "1:POST"      $real_client_ip;
}

limit_req_zone $login_limit_key zone=login_zone:10m rate=5r/m;

limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /static/ {
        alias /app/static_root/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ~ /login/?$ {
        limit_req zone=login_zone burst=3 nodelay;

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ /\. {
        access_log off;
        log_not_found off;
        deny all;
    }

    gzip on;
    gzip_disable "msie6";

    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_buffers 4 32k;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;
}