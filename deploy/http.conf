upstream django {
    server django:8000;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# As duas etapas da entrada: a senha e o código. Cada uma confere um segredo, e
# as duas contam para o mesmo teto.
#
# O teste é sobre o $uri, e não sobre o $request_uri: o location casa o caminho
# já decodificado, e o $request_uri chega cru. Com ele, /log%69n/ caía no
# location do login com a chave vazia, que o limit_req não conta.
map $uri $is_login {
    default               0;
    ~/login(/token)?/?$   1;
}

map $http_cf_connecting_ip $real_client_ip {
    default  $http_cf_connecting_ip;
    ''       $remote_addr;
}

map "$is_login:$request_method" $login_limit_key {
    default       "";
    "1:POST"      $real_client_ip;
}

limit_req_zone $login_limit_key zone=login_zone:10m rate=5r/m;

# O pedido de conta tem teto por IP no próprio app, que é o que conta. Isto aqui
# é só o corte grosso na porta: sem ele, cada insistência custa uma consulta ao
# banco. Pelo $uri, pelo mesmo motivo do login.
map $uri $is_access_request {
    default               0;
    ~/access-request/?$   1;
}

map "$is_access_request:$request_method" $access_request_limit_key {
    default       "";
    "1:POST"      $real_client_ip;
}

limit_req_zone $access_request_limit_key zone=access_request_zone:10m rate=3r/m;

limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /static/ {
        alias /app/static_root/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # No X-Accel-Redirect o nginx só aproveita da resposta do Django os
    # cabeçalhos do próprio arquivo, como o Content-Type e o Cache-Control; os
    # de segurança ficam para trás e voltam aqui.
    location /protected-media/ {
        internal;
        alias /app/media_root/;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location ~ /login(/token)?/?$ {
        limit_req zone=login_zone burst=3 nodelay;

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_redirect off;
    }

    location ~ /access-request/?$ {
        limit_req zone=access_request_zone burst=2 nodelay;

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_redirect off;
    }

    location /assistant/stream/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        gzip off;

        # Um pouco acima do maior anexo que o app aceita: o que passar disso é
        # recusado na porta, sem ocupar uma thread do Django.
        client_max_body_size 10m;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_redirect off;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ /\. {
        access_log off;
        log_not_found off;
        deny all;
    }

    gzip on;
    gzip_disable "msie6";

    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_buffers 4 32k;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;
}