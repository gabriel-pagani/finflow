name: finflow

services:
  database:
    image: postgres:16
    container_name: database
    expose:
      - "5432"
    volumes:
      - ../database:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - network
    restart: unless-stopped

  app:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    image: template
    container_name: app
    expose:
      - "8000"
    volumes:
      - static_volume:/app/static_root
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn project.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 60 --access-logfile - --error-logfile -"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.socket(); s.settimeout(2); s.connect((\"127.0.0.1\",8000)); s.close()'"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    expose:
      - "80"
    volumes:
      - static_volume:/app/static_root
      - ./http.conf:/etc/nginx/conf.d/default.conf  # Change this line to "./https.conf:/etc/nginx/conf.d/default.conf" to enable SSL
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 80"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - network
    restart: unless-stopped
  
  # Uncomment this code snippet to enable SSL
  # certbot:
  #   image: certbot/certbot
  #   container_name: certbot
  #   volumes:
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot
  #   depends_on:
  #     nginx:
  #       condition: service_healthy
  #   command: "certonly --non-interactive --webroot -w /var/www/certbot --email $DEFAULT_EMAIL -d $DOMAIN --agree-tos --no-eff-email"
  #   networks:
  #     - network

  # certbot-renew:
  #   image: certbot/certbot
  #   container_name: certbot-renew
  #   volumes:
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot
  #   depends_on:
  #     certbot:
  #       condition: service_completed_successfully
  #   entrypoint: sh -c "while true; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done"
  #   networks:
  #     - network
  #   restart: unless-stopped

  cloudflare:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - network   
    restart: unless-stopped

volumes:
  static_volume:

networks:
  network: