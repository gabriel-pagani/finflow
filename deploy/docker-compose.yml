name: ${PROJECT_NAME:-finflow}

# O json-file do Docker cresce sem limite; o gunicorn e o nginx registram cada acesso.
x-logging: &logging
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:18
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    # Cada serviço recebe só o que usa. Variável sem valor vem do .env ao lado
    # e, se não estiver lá, fica de fora (o padrão do settings continua valendo).
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - backend
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:8-alpine
    expose:
      - "6379"
    # A senha vai pelo ambiente, e não pela linha de comando, para não aparecer no
    # docker inspect; o REDISCLI_AUTH também serve ao redis-cli do healthcheck. O
    # exec do entrypoint mantém o Redis rodando como o usuário redis, e não root.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no deploy/.env}
    command: ["sh", "-c", "exec docker-entrypoint.sh redis-server --requirepass \"$$REDISCLI_AUTH\" --appendonly yes --save ''"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - backend
    restart: unless-stopped
    logging: *logging

  django:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      target: production
    image: ${PROJECT_NAME:-finflow}-django
    expose:
      - "8000"
    volumes:
      - static_volume:/app/static_root
      - media_volume:/app/media_root
    # Sem a senha do superusuário do Postgres (o app entra com o usuário restrito)
    # e sem os tokens da Cloudflare: quem invadisse o app não leva o túnel.
    environment:
      - SECRET_KEY
      - DEBUG
      - ALLOWED_HOSTS
      - CSRF_TRUSTED_ORIGINS
      - POSTGRES_DB
      - POSTGRES_APP_USER
      - POSTGRES_APP_PASSWORD
      - POSTGRES_HOST
      - POSTGRES_PORT
      - REDIS_URL
      - REDIS_PASSWORD
      - ADMIN_PANEL_PATH
      - OPENAI_API_KEY
      - OPENAI_MODEL
      - OPENAI_TRANSCRIBE_MODEL
      - ASSISTANT_ATTACHMENT_RETENTION_DAYS
      - EMAIL_BACKEND
      - EMAIL_HOST
      - EMAIL_PORT
      - EMAIL_HOST_USER
      - EMAIL_HOST_PASSWORD
      - EMAIL_USE_TLS
      - EMAIL_TIMEOUT
      - DEFAULT_FROM_EMAIL
      - ADMINS
      - PLUGGY_CLIENT_ID
      - PLUGGY_CLIENT_SECRET
      - PLUGGY_WEBHOOK_SECRET
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn project.wsgi:application --bind 0.0.0.0:8000 --worker-class gthread --workers 4 --threads 8 --timeout 300 --graceful-timeout 30 --access-logfile - --error-logfile -"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.socket(); s.settimeout(2); s.connect((\"127.0.0.1\",8000)); s.close()'"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 4g
    # O app roda como usuário comum numa porta alta e não usa nenhuma capability.
    # Sem elas e sem setuid, quem rodasse código aqui não vira root no container.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - frontend
    restart: unless-stopped
    logging: *logging

  # Scripts de manutenção (make protect-login, make create-app-role) precisam
  # de segredos que o app não recebe; só sobem quando chamados.
  tools:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      target: production
    image: ${PROJECT_NAME:-finflow}-django
    env_file:
      - .env
    profiles:
      - tools
    networks:
      - backend
      - frontend

  tests:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      target: test
    image: ${PROJECT_NAME:-finflow}-django-tests
    volumes:
      - ../app:/app/app
      - ../assistant:/app/assistant
      - ../project:/app/project
      - ../templates:/app/templates
      - ../static:/app/static
      - ../tests:/app/tests
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m pytest -vv
    profiles:
      - tests
    networks:
      - backend

  nginx:
    image: nginx:1.30-alpine
    expose:
      - "80"
    volumes:
      - static_volume:/app/static_root
      - media_volume:/app/media_root:ro
      - ./http.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 80"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - frontend
    restart: unless-stopped
    logging: *logging

  cloudflare:
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - frontend
    restart: unless-stopped
    logging: *logging

volumes:
  static_volume:
  media_volume:
  postgres_data:
  redis_data:

# O túnel e o nginx ficam só na frontend: não alcançam o banco nem o Redis.
# A backend é interna (sem saída); o django sai para a internet pela frontend.
networks:
  backend:
    internal: true
  frontend: