name: ${PROJECT_NAME:-finflow}

services:
  postgres:
    image: postgres:18
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - network
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    expose:
      - "6379"
    command: redis-server --appendonly yes --save ""
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - network
    restart: unless-stopped

  django:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      target: production
    image: ${PROJECT_NAME:-finflow}-django
    expose:
      - "8000"
    volumes:
      - static_volume:/app/static_root
      - media_volume:/app/media_root
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn project.wsgi:application --bind 0.0.0.0:8000 --worker-class gthread --workers 4 --threads 8 --timeout 300 --graceful-timeout 30 --access-logfile - --error-logfile -"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.socket(); s.settimeout(2); s.connect((\"127.0.0.1\",8000)); s.close()'"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 4g
    networks:
      - network
    restart: unless-stopped

  tests:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      target: test
    image: ${PROJECT_NAME:-finflow}-django-tests
    # Tudo o que a imagem copia e os testes exercitam entra montado: sem isto,
    # mudança em project/ ou nos templates da casca roda contra a cópia velha
    # que ficou na imagem, e o teste passa ou falha pelo motivo errado.
    volumes:
      - ../app:/app/app
      - ../assistant:/app/assistant
      - ../project:/app/project
      - ../templates:/app/templates
      - ../static:/app/static
      - ../tests:/app/tests
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m pytest -vv
    profiles:
      - tests
    networks:
      - network

  nginx:
    image: nginx:1.30-alpine
    expose:
      - "80"
    volumes:
      - static_volume:/app/static_root
      - media_volume:/app/media_root:ro
      - ./http.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 80"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - network
    restart: unless-stopped

  cloudflare:
    image: cloudflare/cloudflared:2026.9.1
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - network   
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:
  postgres_data:
  redis_data:

networks:
  network: