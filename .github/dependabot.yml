version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      # Trocar de major do Postgres exige migrar o volume de dados
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # Minor ímpar do nginx é mainline; fica só no estável (minor par)
      # ponytail: lista até ~2033, estender quando chegar perto
      - dependency-name: nginx
        versions: ["1.31.x", "1.33.x", "1.35.x", "1.37.x", "1.39.x", "1.41.x", "1.43.x"]

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
